name: ci
# Tests on every push/PR. Every push to main (and every tag v*) also builds the image into
# GHCR and bumps its tag in the private GitOps repo (jaknow01/homelab-gitops), which Argo CD
# syncs to the cluster. main is tagged main-<short sha>, a release tag v* keeps its own name.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/jaknow01/mcp-fpl
  GITOPS_DIR: mcp/fpl
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest -q

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    # Needs repo secret GITOPS_TOKEN: a fine-grained PAT with Contents read/write on
    # jaknow01/homelab-gitops. Without it the step is skipped (image is still published).
    needs: image
    runs-on: ubuntu-latest
    concurrency: gitops-deploy  # one bump at a time, in push order
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::warning::GITOPS_TOKEN not set — bump ${{ env.GITOPS_DIR }} to $TAG by hand"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: jaknow01/homelab-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Bump image tag
        if: steps.token.outputs.ok == 'true'
        working-directory: gitops
        run: |
          yq -i "(.images[] | select(.name == \"$IMAGE\")).newTag = \"$TAG\"" "$GITOPS_DIR/kustomization.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_DIR/kustomization.yaml"
          git diff --cached --quiet && { echo "already at $TAG"; exit 0; }
          git commit -m "deploy(${{ github.event.repository.name }}): $TAG"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 3)); done
          exit 1
