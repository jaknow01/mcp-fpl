[project]
name = "mcp-fpl"
version = "0.4.5"
description = "Fantasy Premier League tools (fixtures, live, squads, mini-leagues, history) and a self-service key page, as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kuba" }]
dependencies = [
    "jarvis-mcp-kit @ git+https://github.com/jaknow01/jarvis-mcp-kit.git@v0.4.0",
    "requests>=2.31",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
mcp-fpl = "mcp_fpl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fpl"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
